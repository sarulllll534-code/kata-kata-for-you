<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim Pesan ke Termux</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 2px 2px 12px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        select, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            margin-top: 15px;
            cursor: pointer;
        }
        button:hover { background-color: #218838; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Form Pesan Direct</h2>

    <label for="pilihan">Pilihan Topik:</label>
    <select id="pilihan">
        <option value="Tanya-tanya">Tanya-tanya</option>
        <option value="Saran">Saran</option>
        <option value="Penting">Penting</option>
    </select>

    <label for="pesan">Isi Pesan:</label>
    <textarea id="pesan" rows="4" placeholder="Ketik pesan kamu di sini..."></textarea>

    <button onclick="kirimPesan()">Kirim Pesan</button>

    <div id="status"></div>

    <script>
        // URL Cloudflared milikmu
        const TERMUX_URL = "https://media-dakota-karen-exceptional.trycloudflare.com/pesan";

        function kirimPesan() {
            const pilihan = document.getElementById('pilihan').value;
            const pesan = document.getElementById('pesan').value;
            const statusDiv = document.getElementById('status');

            if (!pesan.trim()) {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Pesan tidak boleh kosong!";
                return;
            }

            statusDiv.style.color = "black";
            statusDiv.innerText = "Mengirim...";

            fetch(TERMUX_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    pilihan: pilihan,
                    pesan: pesan,
                    waktu: new Date().toLocaleString("id-ID")
                })
            })
            .then(response => {
                if (response.ok) {
                    statusDiv.style.color = "green";
                    statusDiv.innerText = "Pesan berhasil terkirim ke Termux!";
                    document.getElementById('pesan').value = '';
                } else {
                    statusDiv.style.color = "red";
                    statusDiv.innerText = "Gagal mengirim pesan.";
                }
            })
            .catch(error => {
                console.error("Error:", error);
                statusDiv.style.color = "red";
                statusDiv.innerText = "Error: Cek koneksi Termux/Tunnel!";
            });
        }
    </script>
</body>
</html>
